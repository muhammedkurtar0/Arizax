
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArizaX | Akıllı Arıza Bulucu</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#071426;color:#fff;font-family:Arial,sans-serif}
.container{max-width:780px;margin:auto}
header{text-align:center;padding:20px 5px}
.logo{font-size:42px;color:#35aaff;font-weight:bold}
header p{color:#a9bfd5}
.panel,.result{background:#10243c;padding:20px;border-radius:14px;border:1px solid #294968;margin-top:15px}
label{display:block;margin:15px 0 8px;color:#c5d8eb}
input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #34536e;background:#071a30;color:white;font-size:16px}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:9px;background:#1689e8;color:white;font-size:17px;font-weight:bold}
#durum{font-size:14px;color:#62d6a2}
.result h3{color:#42b5ff}
.small{font-size:13px;color:#9db5ca}
.error{color:#ff9999}
a{color:#56baff}
footer{text-align:center;color:#8198ad;font-size:12px;margin:30px 0}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">🔧 ArizaX</div>
<h2>Akıllı Arıza Bulucu</h2>
<p>Arıza kodunu yaz, çözümünü öğren.</p>
<p id="durum">Veri tabanı yükleniyor...</p>
</header>

<div class="panel">
<label>Cihaz türü</label>
<select id="cihaz">
<option value="">Tüm cihazlar</option>
</select>

<label>Marka</label>
<select id="marka">
<option value="">Tüm markalar</option>
</select>

<label>Arıza kodu</label>
<input id="kod" placeholder="Örnek: E01 veya F5">

<button onclick="ara()">🔍 ARIZAYI BUL</button>
</div>

<div id="sonuc"></div>

<footer>
ArizaX © 2026<br>
<a href="https://github.com/ApplianceDB/ApplianceDB-public" target="_blank">Veri kaynağı</a>
<br>Arıza kodları cihaz modeline göre değişebilir.
</footer>
</div>

<script>
const VERI_URL="https://cdn.jsdelivr.net/gh/ApplianceDB/ApplianceDB-public@main/error_codes_fixes_joined.csv";
let arizalar=[];

const vestelArizalari=[
{brand:"Vestel",appliance_type:"washer",code:"E01",meaning:"Kapı kilidi algılanmıyor.",title:"Kapıyı kontrol et.",steps:"Kapağın tam kapandığını ve araya çamaşır sıkışmadığını kontrol et.",diy_difficulty:"Easy"},
{brand:"Vestel",appliance_type:"washer",code:"E02",meaning:"Su girişi yetersiz olabilir.",title:"Su girişini kontrol et.",steps:"Su musluğunun açık olduğunu ve hortumun kıvrılmadığını kontrol et.",diy_difficulty:"Medium"},
{brand:"Vestel",appliance_type:"washer",code:"E03",meaning:"Pompa veya tahliye filtresi sorunu.",title:"Pompa filtresini kontrol et.",steps:"Fişi çek. Kılavuza göre pompa filtresini temizle.",diy_difficulty:"Medium"},
{brand:"Vestel",appliance_type:"washer",code:"E04",meaning:"Makinede fazla su algılanmış olabilir.",title:"Su girişini kapat.",steps:"Makineyi kapat, su musluğunu kapat ve servise başvur.",diy_difficulty:"Hard"},

{brand:"Vestel",appliance_type:"dishwasher",code:"F1",meaning:"Su taşma alarmı.",title:"Su musluğunu kapat.",steps:"Su girişini kapat ve yetkili servise başvur.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F2",meaning:"Atık su boşaltılamıyor olabilir.",title:"Filtreyi kontrol et.",steps:"Tahliye hortumunda kıvrılma ve filtrede tıkanıklık olup olmadığını kontrol et.",diy_difficulty:"Medium"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F3",meaning:"Sürekli su alma hatası.",title:"Su girişini kapat.",steps:"Musluğu kapat ve servise başvur.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F5",meaning:"Su girişi yetersiz.",title:"Su girişini kontrol et.",steps:"Su musluğunu, giriş hortumunu ve filtreyi kontrol et.",diy_difficulty:"Medium"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F6",meaning:"Sıcaklık sensörü hatası olabilir.",title:"Servise başvur.",steps:"Sensör kontrolü için yetkili servis gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F7",meaning:"Aşırı ısınma uyarısı olabilir.",title:"Makineyi kapat.",steps:"Makineyi kapat ve yetkili servise başvur.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F8",meaning:"Isıtıcı hatası olabilir.",title:"Servise başvur.",steps:"Elektrikli parçalara müdahale etme.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"F9",meaning:"Su dağıtım sistemi hatası olabilir.",title:"Servise başvur.",steps:"Su dağıtım sisteminin kontrol edilmesi gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"dishwasher",code:"FE",meaning:"Elektronik kart hatası olabilir.",title:"Servise başvur.",steps:"Elektronik karta müdahale etme.",diy_difficulty:"Hard"},

{brand:"Vestel",appliance_type:"refrigerator",code:"E01",meaning:"Sensör hatası olabilir.",title:"Servise başvur.",steps:"Sensörün teknik kontrolü gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E02",meaning:"Sensör hatası olabilir.",title:"Servise başvur.",steps:"Sensörün teknik kontrolü gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E03",meaning:"Sensör hatası olabilir.",title:"Servise başvur.",steps:"Sensörün teknik kontrolü gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E06",meaning:"Sensör hatası olabilir.",title:"Servise başvur.",steps:"Sensörün teknik kontrolü gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E07",meaning:"Sensör hatası olabilir.",title:"Servise başvur.",steps:"Sensörün teknik kontrolü gerekir.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E08",meaning:"Düşük voltaj uyarısı olabilir.",title:"Elektrik gerilimini kontrol ettir.",steps:"Gerilim normalken hata sürerse servise başvur.",diy_difficulty:"Medium"},
{brand:"Vestel",appliance_type:"refrigerator",code:"E09",meaning:"Dondurucu sıcaklığı yüksek olabilir.",title:"Dondurucu sıcaklığını kontrol et.",steps:"Kapıyı sık açma. Hata devam ederse servise başvur.",diy_difficulty:"Medium"},

{brand:"Vestel",appliance_type:"dryer",code:"E01",meaning:"Kapak algılama sorunu olabilir.",title:"Kapağı kontrol et.",steps:"Kapağın tam kapandığından emin ol.",diy_difficulty:"Easy"},
{brand:"Vestel",appliance_type:"oven",code:"E01",meaning:"Modeline göre değişen hata kodu.",title:"Kullanım kılavuzunu kontrol et.",steps:"Cihazın tam model numarasıyla hata kodunu doğrula.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"air_conditioner",code:"E1",meaning:"Modeline göre değişen klima hata kodu.",title:"Model numarasını kontrol et.",steps:"Klimanın modeline uygun kullanım kılavuzunu incele.",diy_difficulty:"Hard"},
{brand:"Vestel",appliance_type:"television",code:"E01",meaning:"TV modeline göre değişen hata.",title:"Model numarasını kontrol et.",steps:"Televizyonun model numarasına göre teknik destek al.",diy_difficulty:"Medium"}
];

const ceviri={
washer:"Çamaşır makinesi",
dishwasher:"Bulaşık makinesi",
dryer:"Kurutma makinesi",
refrigerator:"Buzdolabı",
oven:"Fırın",
air_conditioner:"Klima",
television:"Televizyon",
Easy:"Kolay",
Medium:"Orta",
Hard:"Zor"
};

function tr(v){return ceviri[v]||v||"Bilgi bulunamadı."}

function guvenli(v){
return String(v||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);
}

function norm(v){
return String(v||"").toLowerCase().trim()
.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replaceAll("ı","i");
}

function csvOku(metin){
const satirlar=[];
let satir=[],hucre="",tirnak=false;
for(let i=0;i<metin.length;i++){
const c=metin[i];
if(c==='"'){
if(tirnak&&metin[i+1]==='"'){hucre+='"';i++}
else tirnak=!tirnak;
}else if(c===","&&!tirnak){
satir.push(hucre);hucre="";
}else if((c==="\n"||c==="\r")&&!tirnak){
if(c==="\r"&&metin[i+1]==="\n")i++;
satir.push(hucre);
if(satir.some(x=>x.trim()))satirlar.push(satir);
satir=[];hucre="";
}else hucre+=c;
}
satir.push(hucre);
if(satir.some(x=>x.trim()))satirlar.push(satir);
if(!satirlar.length)return [];
const basliklar=satirlar.shift().map(x=>x.trim().replace(/^\uFEFF/,""));
return satirlar.map(s=>{
const kayit={};
basliklar.forEach((b,i)=>kayit[b]=(s[i]||"").trim());
return kayit;
});
}

function markalariDoldur(){
const sec=document.getElementById("marka");
const secili=sec.value;
sec.innerHTML='<option value="">Tüm markalar</option>';
[...new Set(arizalar.map(v=>v.brand).filter(Boolean))].sort().forEach(m=>{
const op=document.createElement("option");
op.value=m;op.textContent=m;sec.appendChild(op);
});
sec.value=secili;
}

function cihazlariDoldur(){
const sec=document.getElementById("cihaz");
const secili=sec.value;
sec.innerHTML='<option value="">Tüm cihazlar</option>';
[...new Set(arizalar.map(v=>v.appliance_type).filter(Boolean))].sort().forEach(t=>{
const op=document.createElement("option");
op.value=t;op.textContent=tr(t);sec.appendChild(op);
});
sec.value=secili;
}

async function yukle(){
const durum=document.getElementById("durum");
arizalar=[...vestelArizalari];
try{
const cevap=await fetch(VERI_URL);
if(!cevap.ok)throw new Error("Veri sunucusu açılamadı");
const metin=await cevap.text();
arizalar=[...csvOku(metin),...vestelArizalari];
durum.textContent="✅ "+arizalar.length+" arıza kaydı yüklendi.";
}catch(e){
durum.textContent="⚠️ Çevrim içi veri yüklenemedi. Vestel kayıtları kullanılabilir.";
}
markalariDoldur();
cihazlariDoldur();
}

function ara(){
const kod=norm(document.getElementById("kod").value);
const marka=norm(document.getElementById("marka").value);
const cihaz=norm(document.getElementById("cihaz").value);
const sonuc=document.getElementById("sonuc");
sonuc.innerHTML="";

if(!kod){
sonuc.innerHTML='<div class="result">Lütfen arıza kodunu yaz.</div>';
return;
}

const bulunan=arizalar.filter(v=>
norm(v.code)===kod&&
(!marka||norm(v.brand)===marka)&&
(!cihaz||norm(v.appliance_type)===cihaz)
);

if(!bulunan.length){
sonuc.innerHTML='<div class="result"><h3>Arıza bulunamadı</h3><p>Marka, cihaz ve arıza kodunu kontrol et. Bu kod veri tabanımızda bulunmuyor.</p></div>';
return;
}

sonuc.innerHTML="<h3>Bulunan sonuç: "+bulunan.length+"</h3>";

bulunan.forEach(v=>{
let html='<div class="result">';
html+='<h3>'+guvenli(v.brand)+" - "+guvenli(v.code)+'</h3>';
html+='<p><b>Cihaz:</b> '+guvenli(tr(v.appliance_type))+'</p>';
html+='<p><b>Açıklama:</b> '+guvenli(v.meaning)+'</p>';
if(v.title)html+='<p><b>Çözüm:</b> '+guvenli(v.title)+'</p>';
if(v.steps)html+='<p><b>Yapılacaklar:</b> '+guvenli(v.steps)+'</p>';
if(v.diy_difficulty)html+='<p><b>Zorluk:</b> '+guvenli(tr(v.diy_difficulty))+'</p>';
if(v.source_url)html+='<p><a href="'+guvenli(v.source_url)+'" target="_blank">Kaynağı görüntüle</a></p>';
html+='<p class="small">Not: Arıza kodları cihazın modeline göre değişebilir. Kesin işlem için model kılavuzunu kontrol et.</p>';
html+='</div>';
sonuc.innerHTML+=html;
});
}

document.getElementById("kod").addEventListener("keydown",e=>{
if(e.key==="Enter")ara();
});

yukle();
</script>
</body>
</html>
