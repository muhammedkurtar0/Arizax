
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArizaX - Akıllı Arıza Tespit</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:30px;background:#111a32;border-bottom:2px solid #00d4ff}
h1{color:#00d4ff;font-size:40px;margin:0}
header p{color:#bdc8dc}
.container{max-width:650px;margin:30px auto;padding:15px}
.panel{background:#151f38;padding:25px;border-radius:15px}
h2{text-align:center;color:#00d4ff}
label{display:block;margin:17px 0 7px}
select,input{width:100%;padding:14px;border-radius:8px;border:1px solid #354563;background:#0b1020;color:white;font-size:16px}
button{width:100%;padding:15px;margin-top:22px;border:0;border-radius:8px;background:#00c8f0;color:#06111d;font-weight:bold;font-size:16px}
#sonuc{display:none;margin-top:22px;padding:18px;background:#0b2940;border-left:4px solid #00d4ff;border-radius:8px;line-height:1.7}
footer{text-align:center;padding:25px;color:#8290a8;font-size:13px}
small{color:#bdc8dc}
</style>
</head>
<body>

<header>
<h1>ArizaX</h1>
<p>Akıllı Arıza Tespit Platformu</p>
</header>

<div class="container">
<div class="panel">
<h2>Arıza Kodunu Ara</h2>

<label for="cihaz">Cihaz türü</label>
<select id="cihaz">
<option>Klima</option>
<option>Çamaşır Makinesi</option>
<option>Bulaşık Makinesi</option>
<option>Buzdolabı</option>
<option>Kombi</option>
<option>Televizyon</option>
<option>Fırın</option>
<option>Kurutma Makinesi</option>
</select>

<label for="marka">Marka</label>
<select id="marka">
<option>Vestel</option>
<option>Arçelik</option>
<option>Beko</option>
<option>Samsung</option>
<option>Bosch</option>
<option>LG</option>
<option>Siemens</option>
<option>Daikin</option>
<option>Mitsubishi</option>
</select>

<label for="model">Model numarası</label>
<input id="model" placeholder="Cihaz modelini yaz">

<label for="kod">Arıza kodu</label>
<input id="kod" placeholder="Örn. E18">

<button onclick="arizaAra()">ARIZAYI ARAŞTIR</button>

<div id="sonuc"></div>

<p><small>Arıza kodları modele göre değişebilir. Kesin teşhis için üretici kılavuzunu kontrol edin. Elektrik ve gaz tesisatına müdahale etmeyin.</small></p>
</div>
</div>

<footer>© 2026 ArizaX - Akıllı Arıza Tespit Platformu</footer>

<script>
const arizalar = [
{cihaz:"Çamaşır Makinesi",marka:"Samsung",kod:"4C",aciklama:"Bazı modellerde su besleme hatasıdır. Su musluğunu ve giriş hortumunu kontrol edin."},
{cihaz:"Çamaşır Makinesi",marka:"Samsung",kod:"5C",aciklama:"Bazı modellerde su tahliye hatasıdır."},
{cihaz:"Çamaşır Makinesi",marka:"LG",kod:"OE",aciklama:"Bazı modellerde su tahliye sorunudur."},
{cihaz:"Çamaşır Makinesi",marka:"LG",kod:"UE",aciklama:"Bazı modellerde çamaşır yükü dengesizdir."},
{cihaz:"Çamaşır Makinesi",marka:"Bosch",kod:"E18",aciklama:"Bazı modellerde su tahliye sorunudur."},
{cihaz:"Çamaşır Makinesi",marka:"Bosch",kod:"E23",aciklama:"Bazı modellerde su koruma sistemiyle ilgili hatadır."},
{cihaz:"Bulaşık Makinesi",marka:"Bosch",kod:"E15",aciklama:"Bazı modellerde su koruma sistemi devreye girmiştir. Cihazı kapatıp servis çağırın."},
{cihaz:"Bulaşık Makinesi",marka:"Bosch",kod:"E24",aciklama:"Bazı modellerde su tahliye sorunudur."},
{cihaz:"Bulaşık Makinesi",marka:"Siemens",kod:"E15",aciklama:"Bazı modellerde su koruma uyarısıdır."},
{cihaz:"Klima",marka:"Daikin",kod:"U4",aciklama:"Bazı modellerde iç ve dış ünite iletişim hatasıdır."},
{cihaz:"Klima",marka:"LG",kod:"CH05",aciklama:"Bazı modellerde iç ve dış ünite iletişim hatasıdır."},
{cihaz:"Klima",marka:"Mitsubishi",kod:"E6",aciklama:"Bazı modellerde iç ünite ve dış ünite iletişim hatasıdır."},
{cihaz:"Klima",marka:"Vestel",kod:"E06",aciklama:"Bu kodun anlamı modele göre değişebilir. Model kılavuzundan doğrulayın."},
{cihaz:"Buzdolabı",marka:"Samsung",kod:"5E",aciklama:"Bazı modellerde buz çözme sistemiyle ilgili hata olabilir."},
{cihaz:"Buzdolabı",marka:"Samsung",kod:"22E",aciklama:"Bazı modellerde fan sistemiyle ilgili hata olabilir."}
];

function arizaAra(){
 const cihaz=document.getElementById("cihaz").value;
 const marka=document.getElementById("marka").value;
 const model=document.getElementById("model").value.trim();
 const kod=document.getElementById("kod").value.trim().toUpperCase();
 const sonuc=document.getElementById("sonuc");

 sonuc.style.display="block";

 if(!kod){
  sonuc.innerHTML="Lütfen arıza kodunu yaz.";
  return;
 }

 const kayit=arizalar.find(a=>
  a.cihaz===cihaz &&
  a.marka===marka &&
  a.kod.toUpperCase()===kod
 );

 if(kayit){
  sonuc.innerHTML=`
  <h3>Arıza kaydı bulundu!</h3>
  <b>Cihaz:</b> ${cihaz}<br>
  <b>Marka:</b> ${marka}<br>
  <b>Model:</b> ${model || "Belirtilmedi"}<br>
  <b>Arıza kodu:</b> ${kod}<br><br>
  <b>Açıklama:</b><br>${kayit.aciklama}
  <p><small>Bu açıklama bazı modeller için geçerlidir. Kesin bilgi için cihaz kılavuzunu kontrol edin.</small></p>`;
 }else{
  sonuc.innerHTML=`
  <h3>Bu kod henüz kayıtlı değil.</h3>
  <b>Cihaz:</b> ${cihaz}<br>
  <b>Marka:</b> ${marka}<br>
  <b>Model:</b> ${model || "Belirtilmedi"}<br>
  <b>Kod:</b> ${kod}<br><br>
  Bu kod veri tabanımızda bulunamadı. Modelin kullanım kılavuzunu veya yetkili servisi kontrol edin.`;
 }
}
</script>

</body>
</html>
